    function item(r, mode) {
      const chip = mode === 'have'
        ? `<span class="chip done"><span class="dot"></span>You have this</span>`
        : `<span class="chip request"><span class="dot"></span>Need to request</span>`;
      const note = (A.req[r.id]?.note) ? `<p>${A.req[r.id].note}</p>` : `<p>${mode === 'have' ? r.plain : r.how}</p>`;
      return `<div class="item card" style="box-shadow:none">
        <div class="ic">${mode === 'have' ? '✅' : '📎'}</div>
        <div><h3>${r.title}</h3>${note}${chip}</div>
      </div>`;
    }

    // ---- Live run against the retrieval agent -----------------------------
    // The harness also serves this page, at /patient/, so the final button can
    // reach the API on the same origin. Served as a plain static preview there
    // is no API behind it, and the button says so rather than doing nothing.
    // The API sits beside the page, wherever the page is mounted. Served straight
    // from the harness the page is at /patient/map/, so the API is at /api. Behind
    // a proxy that mounts the harness under a prefix the page is at
    // /<prefix>/patient/map/, so the API is at /<prefix>/api. Deriving the base
    // from our own path keeps both cases working without a build step.
    const API = location.pathname.replace(/\/patient\/.*$/, '') + '/api';
    let apiReady = null;
    async function hasApi() {
      if (apiReady !== null) return apiReady;
      try {
        const r = await fetch(API + '/health', { cache: 'no-store' });
        const j = await r.json();
        apiReady = r.ok && j.ok === true;
      } catch (e) { apiReady = false; }
      return apiReady;
    }

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function li(items) { return (items || []).filter(Boolean).map(t => '<li>' + esc(t) + '</li>').join(''); }

    // Everything the patient told us, as plain lines the agent can read.
    function careNotes() {
      const lines = [];
      reqList().forEach(r => {
        const a = A.req[r.id];
        if (!a || !a.answer) return;
        const label = a.answer === 'yes' ? 'yes' : (a.answer === 'no' ? 'no / not yet' : 'not sure');
        let line = r.title + ': ' + label;
        if (a.followup && r.followup) {
          const o = r.followup.options.find(x => x.id === a.followup);
          if (o) line += ' (' + o.label + ')';
        }
        lines.push(line);
      });
      if (A.story && A.story.trim()) lines.push("In the patient's own words: " + A.story.trim());
      return lines.join('\n');
    }

    const MAX_PAGES = 8;
    const MAX_EDGE = 1600; // the reader downsamples past this anyway

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).split(',')[1] || '');
        fr.onerror = () => rej(new Error('We could not open ' + file.name + '.'));
        fr.readAsDataURL(file);
      });
    }

    async function loadBitmap(file) {
      // createImageBitmap applies the phone's rotation tag, so a sideways photo
      // arrives upright. Older browsers fall back to a plain image element.
      if (window.createImageBitmap) {
        try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
        catch (e) { /* fall through */ }
      }
      const url = URL.createObjectURL(file);
      try {
        return await new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => rej(new Error('We could not open ' + file.name + '.'));
          im.src = url;
        });
      } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
    }

    // A phone photo is several megabytes and far larger than the reader can use.
    // Shrinking it here keeps the upload quick on a mobile connection without
    // losing any detail the reader would have seen.
    async function shrinkImage(file) {
      const bmp = await loadBitmap(file);
      const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
      if (!w0 || !h0) throw new Error('We could not open ' + file.name + '.');
      const scale = Math.min(1, MAX_EDGE / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      return { name: file.name, mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
    }

    async function filesToAttachments(files) {
      const out = [];
      for (const f of (files || []).slice(0, MAX_PAGES)) {
        if ((f.type || '').startsWith('image/')) out.push(await shrinkImage(f));
        else if (f.type === 'application/pdf') {
          if (f.size > 12 * 1024 * 1024) throw new Error(f.name + ' is too large to send. Please attach a smaller file.');
          out.push({ name: f.name, mime: 'application/pdf', data: await fileToBase64(f) });
        }
      }
      return out;
    }
    async function letterAttachments() { return filesToAttachments(A.letterFiles); }

    // The server reads any attached photo into text before the search starts, so
    // send the picture itself. Only describe the gap when there is no letter.
    async function submissionBody() {
      const attachments = await letterAttachments();
      const policy_attachments = await filesToAttachments(A.policyFiles);
      const pasted = (A.letter || '').trim();
      const denial = pasted || (attachments.length ? '' : [
        'The patient did not paste the text of the denial letter.',
        'They could not find the letter.',
        (A.insurer || 'Their insurer') + ' denied ' + (A.surgery || 'the surgery')
          + (A.cpt ? ' (CPT ' + A.cpt + ')' : '') + '.'
      ].join(' '));
      return {
        denial_letter: denial,
        attachments: attachments,
        policy_attachments: policy_attachments,
        policy_consent: !!A.policyConsent,
        payer: A.insurer || '',
        plan_name: '',
        state: A.state || '',
        product_clue: '',
        procedure: A.surgery || '',
        cpt: A.cpt || '',
        treating_practice: '',
        patient_notes: careNotes(),
        retrieval_mode: 'web_only'
      };
    }

    const RUN = { id: null, timer: null, poll: null, startedAt: 0 };
    function stopRun() {
      if (RUN.timer) clearInterval(RUN.timer);
      if (RUN.poll) clearInterval(RUN.poll);
      RUN.timer = null; RUN.poll = null;
    }
    function setRunLine(text) {
      const el = document.getElementById('runline');
      if (el && text) el.textContent = text;
    }

    function runPanel(note) {
      panel(`
        <div class="eyebrow">Working on your appeal</div>
        <h2>Finding the exact rule ${esc(A.insurer || 'your plan')} used</h2>
        <p class="help">We are reading the published policy for ${esc((A.surgery || 'your surgery').toLowerCase())}. This takes a few minutes. You can leave this page open.</p>
        <div class="runbox">
          <div class="spin" aria-hidden="true"></div>
          <div>
            <div class="runline" id="runline">${esc(note)}</div>
            <div class="runtime" id="runtime">0:00 elapsed</div>
          </div>
        </div>
        <div class="answers" style="margin-top:20px">
          <button class="btn btn-ghost btn-lg" id="run-cancel">Stop and go back</button>
        </div>`);
      document.getElementById('run-cancel').onclick = () => { stopRun(); render(); };
      RUN.timer = setInterval(() => {
        const el = document.getElementById('runtime');
        if (!el) return;
        const s = Math.floor((Date.now() - RUN.startedAt) / 1000);
        el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' elapsed';
      }, 1000);
    }

    function previewPanel() {
      panel(`
        <div class="eyebrow">Preview only</div>
        <h2>This preview isn't connected yet</h2>
        <p class="help">You're viewing a preview of OrthoAppeals that isn't linked to the live service, so it can't run your appeal right now. Please open the live site to start your appeal.</p>
        <div class="answers"><button class="btn btn-ghost btn-lg" id="prev-back">← Go back</button></div>`);
      document.getElementById('prev-back').onclick = () => render();
    }

    function failPanel(message) {
      panel(`
        <div class="eyebrow">Something went wrong</div>
        <h2>We could not finish the search</h2>
        <p class="help">Nothing you entered was lost. You can try again.</p>
        <div class="pkt warn"><h3>What happened</h3><p>${esc(message)}</p></div>
        <div class="answers">
          <button class="btn btn-primary btn-lg" id="fail-retry">Try again</button>
          <button class="btn btn-ghost btn-lg" id="fail-back">← Go back</button>
        </div>`);
      document.getElementById('fail-retry').onclick = onBuild;
      document.getElementById('fail-back').onclick = () => render();
    }

    async function onBuild() {
      if (!(await hasApi())) return previewPanel();
      stopRun();
      RUN.startedAt = Date.now();
      runPanel('Sending your answers.');
      let snap;
      try {
        const body = await submissionBody();
        if (body.attachments.length) {
          setRunLine(body.attachments.length > 1
            ? 'Reading the ' + body.attachments.length + ' pages you sent.'
            : 'Reading the letter you sent.');
        }
        const r = await fetch(API + '/episodes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        snap = await r.json();
        if (!r.ok) throw new Error(snap.error || 'The server refused the request.');
      } catch (e) {
        stopRun();
        return failPanel(e.message || String(e));
      }
      RUN.id = snap.manifest && snap.manifest.episode_id;
      if (!RUN.id) { stopRun(); return failPanel('The server did not return a case number.'); }
      setRunLine('Searching for the policy that covers your plan.');
      RUN.poll = setInterval(pollRun, 5000);
    }

    async function pollRun() {
      if (!RUN.id) return;
      let snap;
      try {
        snap = await fetch(API + '/episodes/' + RUN.id, { cache: 'no-store' }).then(r => r.json());
      } catch (e) { return; }
      const arm = (snap.arms && snap.arms.web_only) || {};
      const status = (arm.runtime && arm.runtime.status) || 'running';
      // The harness writes engineering-language events. A patient should never
      // read them, so report the stage in plain words instead of echoing them.
      const events = (snap.events || []).filter(e => e.arm === 'web_only' && e.summary);
      if (events.length) {
        const mins = (Date.now() - RUN.startedAt) / 60000;
        setRunLine(mins < 1 ? 'Looking up the published rules for your plan.'
          : mins < 4 ? 'Reading the policy document your plan follows.'
          : 'Checking your answers against that policy.');
      }
      if (status === 'completed' && arm.result) { stopRun(); packetPanel(arm.result, arm.appeal); return; }
      if (status === 'failed') {
        stopRun();
        failPanel((arm.runtime && arm.runtime.error) || 'The search did not finish.');
      }
    }

    // ---- the finished appeal plan ---------------------------------------
    // The agent returns far more than one screen of text, and a patient holding
    // a phone cannot act on a wall of prose. Nothing the agent said is dropped
    // here. It is reordered around doing: one thing to start, a checklist she
    // can tick and come back to, her own answers to type, and one list to hand
    // the surgeon's office. The reasoning stays one tap away.

    const URL_RE = /https?:\/\/[^\s<>"]+/g;
    const MAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
    // Real separators are required, so a case or reference number can never be
    // mistaken for a telephone number.
    const TEL_RE = /\b1?[-.\s]?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/g;

    // A number she can tap is the difference between calling today and never
    // calling. Only ever linkify what the agent itself returned. A guessed
    // payer number would send her to the wrong place, so we never add one.
    function rich(raw) {
      const text = esc(raw);
      const inline = s => s
        .replace(MAIL_RE, m => `<a href="mailto:${m}">${m}</a>`)
        .replace(TEL_RE, m => `<a href="tel:${m.replace(/[^\d]/g, '')}">${m}</a>`);
      let out = '', last = 0, m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text))) {
        out += inline(text.slice(last, m.index));
        const u = m[0].replace(/[.,;:)]+$/, '');
        out += `<a href="${u}" target="_blank" rel="noopener">${u}</a>` + m[0].slice(u.length);
        last = m.index + m[0].length;
      }
      return out + inline(text.slice(last));
    }
    function richLi(items) {
      return (items || []).filter(Boolean).map(t => '<li>' + rich(t) + '</li>').join('');
    }

    function firstLine(t, cap) {
      const s = String(t == null ? '' : t).trim();
      const m = s.match(/^[\s\S]*?[.!?](?=\s|$)/);
      let out = (m ? m[0] : s).trim();
      const max = cap || 78;
      if (out.length > max) out = out.slice(0, max - 4).replace(/[\s,;:]+\S*$/, '') + '...';
      return out;
    }
    function restLine(t) {
      const s = String(t == null ? '' : t).trim();
      const m = s.match(/^[\s\S]*?[.!?](?=\s|$)/);
      return m ? s.slice(m[0].length).trim() : '';
    }
    function words(token) { return String(token || '').replace(/_/g, ' '); }

    // An appeal takes weeks, so the plan has to survive her closing the page.
    const PLAN = { id: '', done: [], ans: {} };
    function planLoad(id) {
      PLAN.id = id || 'anon'; PLAN.done = []; PLAN.ans = {};
      try {
        const v = JSON.parse(localStorage.getItem('oa.plan.' + PLAN.id) || '{}');
        if (Array.isArray(v.done)) PLAN.done = v.done;
        if (v.ans && typeof v.ans === 'object') PLAN.ans = v.ans;
      } catch (e) { /* a locked down browser just means nothing is remembered */ }
    }
    function planSave() {
      try {
        localStorage.setItem('oa.plan.' + PLAN.id,
          JSON.stringify({ done: PLAN.done, ans: PLAN.ans }));
      } catch (e) { /* out of storage is not worth an error message */ }
    }

    function flash(btn, msg) {
      const was = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = was; }, 1900);
    }
    async function copyOut(text, btn) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }
        flash(btn, '✓ Copied');
      } catch (e) { flash(btn, 'Could not copy'); }
    }

    const ANSWER_HINT = {
      text_or_document_upload: 'What the letter says, in your own words',
      short_text: 'Your answer',
      yes_no_with_date_and_place: 'Yes or no, then roughly when and where',
      dates: 'Dates, as close as you can remember',
      date_and_reference_number: 'The date on the letter, and any reference number'
    };

    function doctorNote(res) {
      const pi = res.patient_interaction || {};
      const ns = res.next_steps || {};
      const src = (res.retrieval && res.retrieval.selected_source) || {};
      const out = ['For the surgeon\'s office, about my denied ' + (A.surgery || 'surgery')
        + (A.cpt ? ' (CPT ' + A.cpt + ')' : '') + ' with ' + (A.insurer || 'my insurer') + '.'];
      if (src.title) { out.push('', 'The policy the plan uses: ' + src.title); }
      if (src.url) out.push(src.url);
      const forOffice = (ns.ordered_actions || []).filter(a => a && a.party === 'provider');
      if (forOffice.length) {
        out.push('', 'What the office would need to do:');
        forOffice.forEach((a, n) => out.push((n + 1) + '. ' + (a.action || '')));
      }
      const recs = pi.provider_records_needed || [];
      if (recs.length) {
        out.push('', 'Records the appeal needs:');
        recs.forEach(r => out.push('- ' + r));
      }
      out.push('', 'Prepared with OrthoAppeals. This is help with insurance paperwork, not medical advice.');
      return out.join('\n');
    }

    function answerNote(qs) {
      const out = ['My answers for the appeal of my ' + (A.surgery || 'surgery') + ':', ''];
      qs.forEach((q, n) => {
        out.push((n + 1) + '. ' + q.text);
        out.push('   ' + ((PLAN.ans[q.question_id || ('q' + n)] || '').trim() || '(not answered yet)'));
        out.push('');
      });
      return out.join('\n');
    }

    function packetPanel(res, appeal) {
      const src = (res.retrieval && res.retrieval.selected_source) || {};
      const cites = (res.retrieval && res.retrieval.citations) || [];
      const cands = ((res.retrieval && res.retrieval.candidates) || []).filter(c => !c.selected);
      const pa = res.policy_analysis || {};
      const ns = res.next_steps || {};
      const pi = res.patient_interaction || {};
      const ci = res.case_identification || {};
      const conf = res.confidence || {};
      const dl = ns.deadline || {};
      const qs = pi.questions || [];
      const gaps = pa.documentation_gaps || [];
      const blockers = res.blockers || [];
      const acts = (ns.ordered_actions || []).map((a, n) => (typeof a === 'string'
        ? { action: a, order: n + 1, party: '', records_needed: [] } : a));
      const mine = acts.filter(a => a.party !== 'provider').length;
      const theirs = acts.length - mine;
      planLoad(res.episode_id);

      const taskRow = (a, n) => {
        const on = PLAN.done.indexOf(n) !== -1;
        const who = a.party === 'provider' ? "Your surgeon's office" : 'You';
        const recs = a.records_needed || [];
        return `
          <div class="task${on ? ' done' : ''}" data-task="${n}">
            <div class="thead">
              <button class="tick" data-tick="${n}" aria-pressed="${on}" aria-label="Mark step ${n + 1} done">✓</button>
              <button class="topen" data-open="${n}" aria-expanded="false" aria-controls="td-${n}">
                <span class="ttitle">${esc(firstLine(a.action))}</span>
                <span class="tmeta">Step ${n + 1} of ${acts.length} · ${esc(who)} · tap to read it all</span>
              </button>
            </div>
            <div class="tdetail" id="td-${n}" hidden>
              <p>${rich(a.action)}</p>
              ${recs.length ? `<div class="need"><b>Have this ready:</b><ul>${richLi(recs)}</ul></div>` : ''}
            </div>
          </div>`;
      };

      const qRow = (q, n) => {
        const id = q.question_id || ('q' + n);
        return `
          <div class="qa">
            <label for="ans-${esc(id)}">${n + 1}. ${rich(q.text)}</label>
            ${q.rationale ? `<button class="why" data-why="${esc(id)}">Why we ask</button>
              <p class="whytext" id="why-${esc(id)}" hidden>${rich(q.rationale)}</p>` : ''}
            <textarea class="field" id="ans-${esc(id)}" data-ans="${esc(id)}" rows="2"
              placeholder="${esc(ANSWER_HINT[q.answer_type] || 'Your answer')}"></textarea>
          </div>`;
      };

      // The headline is the agent's own first sentence and the paragraph is the
      // remainder, so the card never says the same thing twice. A very long
      // first sentence falls back to plain body text rather than a cut headline.
      const startHead = firstLine(ns.primary_action, 999);
      const startBody = startHead.length <= 130 ? restLine(ns.primary_action) : ns.primary_action;

      const deadline = dl.value
        ? `<div class="caveat"><h3>Your deadline — act soon</h3><p>${rich(dl.value)}</p></div>`
        : `<div class="caveat"><h3>Your deadline — act soon</h3><p>Appeal windows are short and easy to miss. Find the date you must appeal by on your denial letter, put it on your calendar, and start now.</p></div>`;

      // Denial-reason-aware: draft a letter only when that's the right next move;
      // otherwise show what to do first.
      const ap = (appeal && appeal.assessment) || null;
      const KIND_HEAD = {
        gather_first: 'First, confirm the exact rule',
        meet_criteria: 'One step to finish first',
        not_appealable: 'A letter may not be the right route here',
        blocked: 'We could not confirm the rule yet'
      };
      const letterSection = !ap ? '' : ap.recommended ? `
        <div class="sec" id="letter-sec">
          <h3>Your appeal letter</h3>
          <div class="letter-cta"><p>We can draft a ready-to-send appeal letter that quotes your plan's own rules back to them. You get two versions: one for your surgeon's office to send, and one you can send yourself.</p></div>
          <div class="rowbtns"><button class="btn btn-primary btn-sm" id="letter-make">Draft my appeal letter</button></div>
          <div id="letter-area"></div>
        </div>` : `
        <div class="sec" id="letter-sec">
          <h3>${esc(KIND_HEAD[ap.kind] || 'Before an appeal letter')}</h3>
          <p class="note">${rich(ap.reason || '')}</p>
        </div>`;

      panel(`
        <div class="eyebrow">Your appeal plan</div>
        <h2>You can appeal this. Here is how.</h2>
        <div class="res">
          ${acts.length ? `<div class="lead">${acts.length} steps in all. ${mine} ${mine === 1 ? 'is' : 'are'} yours to do. ${theirs} ${theirs === 1 ? 'is' : 'are'} for your surgeon's office.</div>` : ''}
          ${ns.primary_action ? `
            <div class="now">
              <div class="lbl">Start here</div>
              ${startHead.length <= 130 ? `<h3>${rich(startHead)}</h3>` : ''}
              ${startBody ? `<p>${rich(startBody)}</p>` : ''}
            </div>` : ''}
          ${deadline}
          ${letterSection}
          ${gaps.length ? `
            <div class="sec">
              <h3>The most likely problem</h3>
              <p class="note">This is our best read of your file. The full list is further down.</p>
              <div class="pkt"><p>${rich(gaps[0])}</p></div>
            </div>` : ''}
          ${acts.length ? `
            <div class="sec">
              <h3>Your checklist</h3>
              <p class="note">Tap a step to read it in full. Tap the box on the left when it is done. This page remembers your ticks, so you can come back to it.</p>
              <div class="prog"><div class="bar"><i id="pbar"></i></div><span class="cnt" id="pcnt"></span></div>
              ${acts.map(taskRow).join('')}
            </div>` : ''}
          ${ns.safety_caveat ? `<div class="caveat"><h3>Please read this before you act</h3><p>${rich(ns.safety_caveat)}</p></div>` : ''}
          <div class="rowbtns">
            <button class="btn btn-ghost btn-sm" id="plan-print">Print this plan or save it as a PDF</button>
          </div>
        </div>`);

      const el = id => document.getElementById(id);
      const refreshProgress = () => {
        const bar = el('pbar'), cnt = el('pcnt');
        if (bar) bar.style.width = (acts.length ? Math.round(100 * PLAN.done.length / acts.length) : 0) + '%';
        if (cnt) cnt.textContent = PLAN.done.length + ' of ' + acts.length + ' done';
      };
      document.querySelectorAll('[data-tick]').forEach(b => b.onclick = () => {
        const n = Number(b.dataset.tick);
        const at = PLAN.done.indexOf(n);
        if (at === -1) PLAN.done.push(n); else PLAN.done.splice(at, 1);
        planSave();
        const on = PLAN.done.indexOf(n) !== -1;
        document.querySelector('[data-task="' + n + '"]').classList.toggle('done', on);
        b.setAttribute('aria-pressed', String(on));
        refreshProgress();
      });
      document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
        const d = el('td-' + b.dataset.open);
        const opening = d.hasAttribute('hidden');
        if (opening) d.removeAttribute('hidden'); else d.setAttribute('hidden', '');
        b.setAttribute('aria-expanded', String(opening));
      });
      document.querySelectorAll('[data-why]').forEach(b => b.onclick = () => {
        const p = el('why-' + b.dataset.why);
        const opening = p.hasAttribute('hidden');
        if (opening) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
        b.textContent = opening ? 'Hide why we ask' : 'Why we ask';
      });
      document.querySelectorAll('[data-ans]').forEach(t => {
        t.value = PLAN.ans[t.dataset.ans] || '';
        t.oninput = () => { PLAN.ans[t.dataset.ans] = t.value; planSave(); };
      });
      if (el('q-copy')) el('q-copy').onclick = e => copyOut(answerNote(qs), e.currentTarget);
      if (el('doc-copy')) el('doc-copy').onclick = e => copyOut(doctorNote(res), e.currentTarget);
      if (el('doc-share')) el('doc-share').onclick = () => {
        navigator.share({ title: 'Records my appeal needs', text: doctorNote(res) }).catch(() => {});
      };
      el('plan-print').onclick = () => {
        document.querySelectorAll('.acc').forEach(d => { d.open = true; });
        document.querySelectorAll('.tdetail, .whytext').forEach(d => d.removeAttribute('hidden'));
        window.print();
      };
      if (el('restart2')) el('restart2').onclick = resetAll;

      // ---- appeal letter ------------------------------------------------
      if (ap && ap.recommended) {
        const area = () => el('letter-area');
        const LBL = { provider: "For my surgeon's office", patient: 'For me to send' };
        const showError = msg => { const a = area(); if (a) a.innerHTML = `<div class="pkt warn"><p>${esc(msg)}</p></div>`; };
        const renderLetters = letters => {
          const versions = Object.keys(letters).filter(v => letters[v] && letters[v].markdown);
          if (!versions.length) return showError('We could not draft the letter just now. Please try again.');
          let cur = versions[0];
          const draw = () => {
            const md = letters[cur].markdown;
            area().innerHTML =
              (versions.length > 1 ? `<div class="ltabs">${versions.map(v => `<button class="lt${v === cur ? ' on' : ''}" data-lv="${v}">${LBL[v] || v}</button>`).join('')}</div>` : '') +
              `<div class="letter">${renderLetter(md)}</div>` +
              `<div class="rowbtns"><button class="btn btn-primary btn-sm" id="letter-copy">Copy this letter</button><button class="btn btn-ghost btn-sm" id="letter-print">Print or save as PDF</button></div>`;
            area().querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { cur = b.dataset.lv; draw(); });
            el('letter-copy').onclick = ev => copyOut(letterPlain(md), ev.currentTarget);
            el('letter-print').onclick = () => printLetter(renderLetter(md), 'Appeal letter for ' + (A.surgery || 'my surgery'));
          };
          draw();
          const mk = el('letter-make'); if (mk) mk.style.display = 'none';
        };
        const mk = el('letter-make');
        if (mk) mk.onclick = async ev => {
          const btn = ev.currentTarget, was = btn.textContent;
          btn.disabled = true; btn.textContent = 'Writing your letter… this takes a moment';
          try {
            const j = await fetch(API + '/episodes/' + res.episode_id + '/appeal-letter', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ arm: 'web_only' })
            }).then(r => r.json());
            if (j.letters) renderLetters(j.letters);
            else { showError((j.errors && Object.values(j.errors)[0]) || j.error || 'We could not draft the letter just now. Please try again.'); btn.disabled = false; btn.textContent = was; }
          } catch (e) { showError(e.message || 'Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = was; }
        };
        // Already drafted on a previous visit? Load them back.
        const have = appeal.letters_available || [];
        if (have.length) {
          Promise.all(have.map(v => fetch(API + '/episodes/' + res.episode_id + '/appeal-letter/web_only?version=' + v, { cache: 'no-store' })
            .then(r => r.json()).catch(() => null)))
            .then(list => {
              const letters = {};
              (list || []).forEach(x => { if (x && x.markdown) letters[x.version] = { markdown: x.markdown }; });
              if (Object.keys(letters).length) renderLetters(letters);
            });
        }
      }
      refreshProgress();
    }

    // ---- letter rendering helpers ---------------------------------------
    function inlineMd(s) {
      let t = esc(s);
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
           .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
           .replace(/\[([^\]\n]+)\]/g, '<mark>[$1]</mark>')
           .replace(MAIL_RE, m => `<a href="mailto:${m}">${m}</a>`);
      return t;
    }
    function renderLetter(md) {
      const blocks = String(md == null ? '' : md).replace(/\r/g, '').trim().split(/\n{2,}/);
      return blocks.map(b => {
        const h = b.match(/^#{1,6}\s+([\s\S]+)$/);
        if (h) return '<h4>' + inlineMd(h[1].trim()) + '</h4>';
        return '<p>' + inlineMd(b).replace(/\n/g, '<br>') + '</p>';
      }).join('');
    }
    function letterPlain(md) {
      return String(md == null ? '' : md)
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, '$1$2')
        .trim();
    }
    function printLetter(html, title) {
      const w = window.open('', '_blank');
      if (!w) { window.print(); return; }
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) +
        '</title><style>body{font-family:Georgia,\'Times New Roman\',serif;line-height:1.6;max-width:680px;margin:40px auto;padding:0 24px;color:#1a1a1a}h4{font-size:18px;margin:18px 0 6px}p{margin:0 0 13px}mark{background:#fdf1d6;padding:0 3px}em{color:#555}</style></head><body>' +
        html + '</body></html>');
      w.document.close(); w.focus();
      setTimeout(() => { try { w.print(); } catch (e) {} }, 300);
    }

    function resetAll() {
      stopRun();
      RUN.id = null;
      A.catId=''; A.surgery=''; A.cpt=''; A.bodyPart=''; A.state=''; A.insurer='';
      A.letter=''; A.letterFiles=[]; A.letterName=''; A.policyFiles=[]; A.policyName=''; A.policyConsent=false; A.req={}; A.story='';
      A.__demoExample=false; reached = 0;
      buildFlow(); showHero();
    }

    function next() { i = Math.min(flow.length - 1, i + 1); render(); }

    showHero();
  </script>
</body>

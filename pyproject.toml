[project]
name = "mdplus-denial-agent-lab"
version = "0.1.0"
description = "Synthetic-patient UI that launches isolated insurance-policy retrieval agents."
requires-python = ">=3.11"
dependencies = [
    # The sustainable execution engine (synthetic_harness/api_runner.py) talks
    # to the Messages API directly, authenticated by ANTHROPIC_API_KEY. The
    # legacy claude/codex CLI engines do not need this.
    "anthropic>=0.40",
    # web_search / http_fetch tooling.
    "requests>=2.31",
]

[project.optional-dependencies]
# Lets the fetch tool decode brotli/zstd-compressed payer pages instead of
# recording them as blocked (see scripts/policy_eval/webtools.py).
fetch = ["brotli", "zstandard"]
# Envelope encryption of PHI at rest (synthetic_harness/encryption.py). Only
# needed when MDPLUS_ENCRYPTION_KEY is configured.
crypto = ["cryptography>=42"]
# Model providers for the api engine (synthetic_harness/providers.py). Anthropic
# is the default; install the others only for the accuracy bake-off.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
google = ["google-genai>=0.3"]
# Everything needed to run all three providers head-to-head.
providers = ["anthropic>=0.40", "openai>=1.40", "google-genai>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

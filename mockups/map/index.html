<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrthoAppeals: appeal a denied surgery</title>
<meta name="description" content="Appeal a denied surgery — organize your insurance appeal, step by step." />
<meta name="theme-color" content="#1f7d70" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;640;680&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/base.css" />
<style>
  .stage { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 6px 24px 40px; }
  .stage.flowing { max-width: 940px; }

  /* hero / landing */
  .hero { text-align: center; padding: 26px 8px 10px; }
  .hero .promise-kicker { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-deep); }
  .hero h1 { font-size: clamp(34px, 6vw, 56px); margin: 14px auto 16px; max-width: 16ch; }
  .hero p { font-size: 21px; color: var(--ink-soft); max-width: 52ch; margin: 0 auto 30px; }
  .hero .cta { display: grid; gap: 14px; max-width: 440px; margin: 0 auto; }
  .hero .example-link { background: none; border: none; color: var(--teal-deep); font-family: var(--sans); font-size: 17px; font-weight: 640; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
  .hero .trust { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 28px; font-size: 15px; color: var(--ink-soft); }
  .hero .trust span { display: inline-flex; align-items: center; gap: 7px; }

  /* two-column layout */
  .cols { display: grid; grid-template-columns: 250px 1fr; gap: 26px; align-items: start; }

  .rail { padding: 18px 15px; position: sticky; top: 16px; }
  .railhead { font-family: var(--serif); font-size: 18px; margin: 2px 6px 4px; }
  .railsub { font-size: 13px; color: var(--ink-soft); margin: 0 6px 12px; }
  .rstep { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; font-family: var(--sans); font-size: 15.5px; font-weight: 640; color: var(--ink-soft); padding: 9px 8px; border-radius: 10px; cursor: default; }
  .rstep .rmark { width: 27px; height: 27px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13.5px; font-weight: 700; background: var(--paper-2); color: var(--ink-soft); border: 2px solid var(--line); transition: .2s; }
  .rstep.up { opacity: .48; }
  .rstep.on { color: var(--ink); }
  .rstep.on .rmark { background: var(--teal); color: #fff; border-color: var(--teal); transform: scale(1.06); }
  .rstep.done { color: var(--ink); }
  .rstep.done .rmark { background: var(--green); color: #fff; border-color: var(--green); }
  .rstep[data-jump] { cursor: pointer; }
  .rstep[data-jump]:hover { background: var(--paper-2); }
  .rstep:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .panel { padding: 36px 34px; text-align: center; }
  .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-deep); }
  .panel h2 { font-size: clamp(24px, 3.6vw, 33px); margin: 10px 0 8px; }
  .panel .help { font-size: 17px; color: var(--ink-soft); margin: 0 auto 24px; max-width: 42ch; }
  .answers { display: grid; gap: 13px; max-width: 460px; margin: 0 auto; }
  .field { width: 100%; font-family: var(--sans); font-size: 20px; padding: 16px 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); }
  .field:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-color: var(--teal); }
  textarea.field { min-height: 150px; resize: vertical; line-height: 1.5; }
  .back { display: inline-flex; gap: 8px; margin-top: 20px; background: none; border: none; color: var(--ink-soft); font-family: var(--sans); font-size: 17px; font-weight: 640; cursor: pointer; }

  .trustbar { text-align: center; margin: 22px auto 0; font-size: 14.5px; font-weight: 640; color: var(--teal-deep); background: var(--teal-tint); border-radius: 999px; padding: 9px 20px; display: inline-flex; align-items: center; gap: 8px; }
  .trustwrap { text-align: center; }

  /* summary */
  .band { background: var(--teal-tint); color: var(--teal-deep); border-radius: 14px; padding: 16px 20px; font-size: 18px; font-weight: 640; max-width: 540px; margin: 0 auto 22px; }
  .sum { display: grid; gap: 13px; text-align: left; max-width: 560px; margin: 0 auto 24px; }
  .sum .item { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 18px 20px; align-items: start; }
  .sum .item .ic { font-size: 22px; }
  .sum .item h3 { font-size: 19px; margin-bottom: 3px; }
  .sum .item p { font-size: 15.5px; color: var(--ink-soft); margin: 0; }
  .sum .item .chip { margin-top: 8px; }

  /* live run + finished packet */
  .runbox { display: flex; gap: 16px; align-items: center; justify-content: center; text-align: left; max-width: 460px; margin: 0 auto; padding: 18px 20px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); }
  .spin { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--teal); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .runline { font-size: 16px; font-weight: 640; }
  .runtime { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .pkt { text-align: left; max-width: 620px; margin: 0 auto 18px; padding: 18px 20px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); }
  .pkt h3 { font-size: 19px; margin-bottom: 6px; }
  .pkt p { font-size: 16px; color: var(--ink-soft); margin: 0; }
  .pkt ul, .pkt ol { font-size: 16px; color: var(--ink-soft); margin: 0; padding-left: 22px; }
  .pkt li { margin-bottom: 7px; }
  .pkt.warn { border-color: var(--amber); background: var(--amber-tint); }

  /* the finished appeal plan */
  .res { text-align: left; max-width: 640px; margin: 0 auto; }
  .lead { background: var(--teal-tint); color: var(--teal-deep); border-radius: 14px; padding: 15px 18px; font-size: 17px; font-weight: 640; margin: 0 0 18px; }
  .now { border: 2px solid var(--teal); border-radius: 16px; background: var(--card); padding: 20px; margin: 0 0 22px; box-shadow: var(--shadow-sm); }
  .now .lbl { font-size: 13.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-deep); }
  .now h3 { font-size: 23px; margin: 7px 0 9px; }
  .now p { font-size: 17.5px; line-height: 1.55; margin: 0; }
  .sec { margin: 0 0 26px; }
  .sec > h3 { font-size: 22px; margin: 0 0 5px; }
  .sec > .note { font-size: 15.5px; color: var(--ink-soft); margin: 0 0 14px; }
  .prog { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .prog .bar { flex: 1; height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .25s; }
  .prog .cnt { font-size: 14.5px; font-weight: 640; color: var(--ink-soft); white-space: nowrap; }
  .task { border: 2px solid var(--line); border-radius: 14px; background: var(--card); margin-bottom: 11px; overflow: hidden; }
  .task.done { border-color: var(--green); background: var(--green-tint); }
  .thead { display: flex; align-items: stretch; }
  .tick { flex: none; width: 58px; border: none; border-right: 2px solid var(--line); background: transparent; color: transparent; font-size: 25px; font-weight: 700; cursor: pointer; }
  .task.done .tick { color: var(--green); border-right-color: var(--green); }
  .tick:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .topen { flex: 1; text-align: left; background: none; border: none; font-family: var(--sans); color: var(--ink); padding: 14px 16px; min-height: 64px; cursor: pointer; }
  .topen .ttitle { display: block; font-size: 17px; font-weight: 640; line-height: 1.35; }
  .topen .tmeta { display: block; margin-top: 5px; font-size: 13.5px; font-weight: 640; color: var(--ink-soft); }
  .task.done .ttitle { color: var(--ink-soft); text-decoration: line-through; }
  .tdetail { padding: 0 16px 16px; border-top: 2px dashed var(--line); }
  .tdetail p { font-size: 16.5px; line-height: 1.55; margin: 14px 0 0; }
  .tdetail .need { margin-top: 14px; font-size: 15.5px; color: var(--ink-soft); }
  .tdetail .need b { color: var(--ink); }
  .tdetail ul { margin: 6px 0 0; padding-left: 20px; }
  .qa { border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 16px; margin-bottom: 11px; }
  .qa label { display: block; font-size: 16.5px; font-weight: 640; line-height: 1.45; margin-bottom: 8px; }
  .qa textarea.field { min-height: 78px; font-size: 17px; padding: 12px 14px; }
  .why { background: none; border: none; padding: 2px 0 10px; color: var(--teal-deep); font-family: var(--sans); font-size: 15px; font-weight: 640; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .whytext { font-size: 15px; color: var(--ink-soft); margin: 0 0 10px; }
  .acc { border: 2px solid var(--line); border-radius: 14px; background: var(--card); margin-bottom: 10px; }
  .acc > summary { list-style: none; cursor: pointer; padding: 16px; font-size: 17px; font-weight: 640; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::after { content: "+"; font-size: 25px; color: var(--teal-deep); }
  .acc[open] > summary::after { content: "\2212"; }
  .acc .body { padding: 0 16px 16px; font-size: 16px; color: var(--ink-soft); line-height: 1.55; }
  .acc .body p { margin: 0 0 12px; }
  .acc .body ul, .acc .body ol { margin: 0 0 12px; padding-left: 20px; }
  .acc .body li { margin-bottom: 8px; }
  .acc .body h4 { font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--ink); margin: 16px 0 6px; }
  .quote { border-left: 4px solid var(--line); padding-left: 12px; margin: 6px 0 0; font-style: italic; }
  .caveat { border: 2px solid var(--amber); background: var(--amber-tint); border-radius: 14px; padding: 18px; margin: 0 0 22px; }
  .caveat h3 { font-size: 19px; margin: 0 0 7px; }
  .caveat p { font-size: 16px; line-height: 1.55; margin: 0; }
  .rowbtns { display: grid; gap: 11px; margin-top: 14px; }
  .btn-sm { font-size: 17px; padding: 15px 20px; min-height: 56px; width: 100%; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .consent { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 16px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); font-size: 15px; line-height: 1.5; color: var(--ink-soft); }
  .consent input[type="checkbox"] { width: 24px; height: 24px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--teal-deep); }
  .consent b { color: var(--ink); }
  .pol-how { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 18px; margin: 0 0 16px; }
  .pol-how h3 { font-size: 16px; margin: 0 0 8px; }
  .pol-how ol { margin: 0 0 8px; padding-left: 20px; }
  .pol-how li { font-size: 15.5px; line-height: 1.5; margin-bottom: 6px; }
  .pol-phone { font-size: 14.5px; color: var(--ink-soft); margin: 4px 0 0; }

  /* appeal letter */
  .letter-cta { border: 2px solid var(--teal); background: var(--teal-tint); border-radius: 14px; padding: 16px 18px; margin: 0 0 6px; }
  .letter-cta p { margin: 0; font-size: 16px; color: var(--ink-soft); }
  .ltabs { display: flex; gap: 9px; flex-wrap: wrap; margin: 14px 0 12px; }
  .lt { flex: 1 1 44%; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-family: var(--sans); font-size: 15.5px; font-weight: 640; color: var(--ink-soft); cursor: pointer; min-height: 52px; }
  .lt.on { border-color: var(--teal-deep); color: var(--ink); background: var(--teal-tint); }
  .letter { border: 2px solid var(--line); border-radius: 14px; background: var(--paper); padding: 22px; font-size: 16px; line-height: 1.62; }
  .letter h4 { font-family: var(--serif); font-weight: 700; font-size: 18px; margin: 18px 0 6px; }
  .letter h4:first-child { margin-top: 0; }
  .letter p { margin: 0 0 13px; }
  .letter p:last-child { margin-bottom: 0; }
  .letter em { color: var(--ink-soft); }
  .letter mark { background: var(--amber-tint); border-radius: 4px; padding: 0 3px; }

  @media print {
    .brand .tag, .rail, .btn, .tick, .why, .prog, .ltabs, .letter-cta { display: none !important; }
    .acc .body, .tdetail, .whytext { display: block !important; }
    .card, .task, .acc, .qa, .now, .caveat, .letter { break-inside: avoid; box-shadow: none; }
  }

  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; gap: 14px; }
    .rail { position: static; display: flex; overflow-x: auto; gap: 6px; padding: 12px; -webkit-overflow-scrolling: touch; }
    .railhead, .railsub { display: none; }
    .rstep { flex: 0 0 auto; width: auto; padding: 8px 12px 8px 8px; }
    .rstep .rname { white-space: nowrap; }
    .panel { padding: 30px 22px; }
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark"><img src="icons/icon-192.png" alt="" width="40" height="40" style="border-radius:11px;display:block" /></div>
    <div class="name">Ortho<span>Appeals</span></div>
    <div class="tag">Free help appealing a denied surgery</div>
  </div>

  <div class="stage" id="stage"><div id="app"></div></div>

  <script src="../assets/data.js"></script>
  <script>
    // DEMO mode: ?demo=1 (or a hard-wired flag in the self-contained build)
    // makes the whole flow run offline against canned data. Inert otherwise.
    window.__ORTHO_DEMO__ = window.__ORTHO_DEMO__ ||
      /[?&]demo=1\b/.test(location.search);
  </script>
  <script src="demo.js"></script>
  <script>
    const D = window.APPEAL;
    const REQ = D.requirements;

    // One page serves both devices. Layout adapts through the media query below;
    // this flag adapts the WORDING, so a phone visitor is told to photograph the
    // letter and a computer visitor is told to attach a file, instead of both.
    const IS_PHONE = Math.min(
      window.innerWidth,
      window.screen ? window.screen.width : window.innerWidth) <= 768;
    document.documentElement.dataset.device = IS_PHONE ? 'phone' : 'desktop';
    const LETTER_HINT = IS_PHONE
      ? 'Take a picture of it with your phone, or add a PDF or screenshot.'
      : 'Add a PDF, a photo, or a screenshot from your computer.';
    const app = document.getElementById('app');
    const stage = document.getElementById('stage');

    // Imaging questions are derived from the chosen bodyPart (knee → X-ray only;
    // everything else → X-ray + MRI). Returns the imaging requirement objects.
    function imagingFor(bodyPart) {
      const ids = D.imagingByBodyPart[bodyPart] || D.imagingByBodyPart._default;
      return ids.map(id => D.imaging[id]);
    }
    // The full requirement list for this appeal = flat requirements + bodyPart imaging.
    function reqList() { return [...REQ, ...imagingFor(A.bodyPart)]; }
    // Look up any requirement (flat or imaging) by id.
    function reqById(id) { return reqList().find(r => r.id === id); }

    // The flow rebuilds when bodyPart changes so imaging steps track the choice.
    // Initial buildFlow() is called AFTER `A` is declared (below) to avoid a
    // temporal-dead-zone error, since reqList() reads A.bodyPart.
    let flow = [];
    function buildFlow() {
      flow = ['surgery', 'state', 'insurer', 'letter', 'policy', ...reqList().map(r => r.id), 'summary'];
    }
    const stepName = key => {
      if (key === 'surgery') return 'Your surgery';
      if (key === 'state') return 'Your state';
      if (key === 'insurer') return 'Your insurance';
      if (key === 'letter') return 'Denial letter';
      if (key === 'policy') return 'Your policy';
      if (key === 'summary') return 'Your appeal packet';
      const r = reqById(key);
      return r ? r.title : key;
    };

    let started = false, i = 0;
    // catId = chosen category, bodyPart drives imaging + insurer/state gating.
    const A = { catId: '', surgery: '', cpt: '', bodyPart: '', state: '', insurer: '', letter: '', letterFiles: [], letterName: '', policyFiles: [], policyName: '', policyConsent: false, req: {} }; // starts EMPTY
    buildFlow(); // now safe: A exists

    // The imaging steps (and therefore flow length + the rail) change with the
    // chosen bodyPart. Call this after buildFlow() so the two-column shell/rail
    // rebuilds from the new flow instead of keeping the stale step list.
    function rebuildShell() { const c = app.querySelector('.cols'); if (c) c.remove(); }

    function showHero() {
      started = false; stage.classList.remove('flowing');
      app.innerHTML = `
        <section class="hero rise">
          <div class="promise-kicker">Free · Plain language · Takes a few minutes</div>
          <h1>${D.product.tagline}</h1>
          <p>${D.product.promise}</p>
          <div class="cta">
            <button class="btn btn-primary btn-lg" id="start">Start my appeal →</button>
            <button class="example-link" id="ex">Or see how it works with an example</button>
          </div>
          <div class="trust">
            <span>🔒 Private. Nothing leaves your ${IS_PHONE ? 'phone' : 'computer'}</span>
            <span>💬 No insurance jargon</span>
            <span>📄 Ends with a ready appeal packet</span>
          </div>
        </section>`;
      document.getElementById('start').onclick = () => { started = true; i = 0; render(); };
      document.getElementById('ex').onclick = loadExample;
    }

    function loadExample() {
      const ex = D.example;
      A.__demoExample = true; // marks the scripted Maria/Aetna/knee walkthrough
      A.surgery = ex.surgery; A.bodyPart = 'knee'; A.catId = 'knee';
      A.state = 'California'; A.insurer = ex.plan; A.letter = ex.denialLetter;
      buildFlow();
      A.req = {}; reqList().forEach(r => A.req[r.id] = { have: true, note: ex.answers[r.id] });
      // Build the shell (so #q exists), then run straight to the finished appeal
      // plan rather than parking on a pre-filled review form.
      started = true; i = flow.length - 1; render(); onBuild();
    }

    function railHTML() {
      const done = i;
      const steps = flow.map((key, idx) => {
        const st = idx < i ? 'done' : idx === i ? 'on' : 'up';
        const jump = idx < i ? ` data-jump="${idx}"` : ' disabled';
        const mark = idx < i ? '✓' : (idx + 1);
        const cur = idx === i ? ' aria-current="step"' : '';
        return `<button class="rstep ${st}"${jump}${cur}>
          <span class="rmark">${mark}</span><span class="rname">${stepName(key)}</span></button>`;
      }).join('');
      return `<div class="railhead">Your appeal</div>
        <p class="railsub">${done} of ${flow.length} steps done. Every step is right here.</p>${steps}`;
    }

    function render() {
      if (!started) return showHero();
      stage.classList.add('flowing');
      // Build the two-column shell once; afterwards update the rail IN PLACE so its
      // scroll position is kept and the active step advances one at a time
      // (step N → N+1) instead of the strip resetting to step 1 and racing across.
      if (!app.querySelector('.cols')) {
        app.innerHTML = `
          <div class="cols">
            <aside class="rail card">${railHTML()}</aside>
            <section>
              <div id="q"></div>
              <div class="trustwrap"><div class="trustbar">🔒 Always free · No email or credit card, ever.</div></div>
              <div id="backwrap" style="text-align:center"></div>
            </section>
          </div>`;
      }
      updateRail();
      updateBack();
      drawStep();
      centerActiveStep();
    }

    function updateRail() {
      const rail = app.querySelector('.rail');
      if (!rail) return;
      rail.querySelectorAll('.rstep').forEach((btn, idx) => {
        const st = idx < i ? 'done' : idx === i ? 'on' : 'up';
        btn.className = 'rstep ' + st;
        btn.querySelector('.rmark').textContent = idx < i ? '✓' : (idx + 1);
        if (idx < i) {
          btn.dataset.jump = idx; btn.removeAttribute('disabled');
          btn.onclick = () => { i = idx; render(); };
        } else {
          delete btn.dataset.jump; btn.setAttribute('disabled', ''); btn.onclick = null;
        }
        if (idx === i) btn.setAttribute('aria-current', 'step'); else btn.removeAttribute('aria-current');
      });
      const sub = rail.querySelector('.railsub');
      if (sub) sub.textContent = `${i} of ${flow.length} steps done. Every step is right here.`;
    }

    function updateBack() {
      const wrap = app.querySelector('#backwrap');
      if (!wrap) return;
      if (i > 0) {
        wrap.innerHTML = `<button class="back" id="back">← Go back</button>`;
        wrap.querySelector('#back').onclick = () => { i = Math.max(0, i - 1); render(); };
      } else {
        // On the first step, "back" returns to the landing page.
        wrap.innerHTML = `<button class="back" id="back">← Back to start</button>`;
        wrap.querySelector('#back').onclick = () => { started = false; showHero(); };
      }
    }

    // On mobile the roadmap is a horizontal strip; keep the active step in view.
    function centerActiveStep() {
      const rail = app.querySelector('.rail');
      if (!rail) return;
      const active = rail.querySelector('.rstep.on');
      if (!active) return;
      requestAnimationFrame(() => {
        const r = rail.getBoundingClientRect();
        const a = active.getBoundingClientRect();
        const delta = (a.left - r.left) - (r.width - a.width) / 2;
        if (Math.abs(delta) > 1) rail.scrollBy({ left: delta, behavior: 'smooth' });
      });
    }

    function panel(inner) { document.getElementById('q').innerHTML = `<div class="card panel rise">${inner}</div>`; }

    function drawStep() {
      const key = flow[i];
      if (key === 'surgery') return drawSurgery();
      if (key === 'state') return drawState();
      if (key === 'insurer') return drawInsurer();
      if (key === 'letter') return drawLetter();
      if (key === 'policy') return drawPolicy();
      if (key === 'summary') return drawSummary();
      drawReq(reqById(key));
    }

    // Two-part picker: first pick a body-area category, then a specific
    // procedure (or type your own). Choosing sets A.bodyPart, which drives the
    // imaging questions and rebuilds the flow.
    function drawSurgery() {
      if (!A.catId) return drawCategory();
      return drawSubtype();
    }

    function drawCategory() {
      panel(`
        <h2>Let's start simple. What kind of surgery did they say no to?</h2>
        <p class="help">Pick the part of the body. Next you'll choose the exact surgery, or you can type your own.</p>
        <div class="answers">
          ${D.procedureCategories.map(c => `<button class="btn btn-ghost btn-lg" data-cat="${c.id}">${c.label}</button>`).join('')}
          <button class="btn btn-ghost btn-lg" data-cat="__other">My surgery isn't listed here</button>
        </div>`);
      document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
        if (b.dataset.cat === '__other') {
          A.catId = '__other'; A.bodyPart = ''; A.surgery = ''; A.cpt = '';
        } else {
          const c = D.procedureCategories.find(x => x.id === b.dataset.cat);
          A.catId = c.id; A.bodyPart = c.bodyPart; A.surgery = ''; A.cpt = '';
        }
        buildFlow(); rebuildShell(); A.req = {}; render(); // re-draw same step (now the subtype view)
      });
    }

    function drawSubtype() {
      if (A.catId === '__other') {
        panel(`
          <h2>Tell us the surgery in your own words</h2>
          <p class="help">Whatever the letter or your doctor called it is fine. This is just so we use the right words in your appeal.</p>
          <div class="answers">
            <input class="field" id="sother" placeholder="Type your surgery" value="${A.surgery || ''}" />
            <button class="btn btn-primary btn-lg" id="s-next">Continue →</button>
            <button class="btn btn-ghost btn-lg" id="s-back-cat">← Pick from the list instead</button>
          </div>`);
        const f = document.getElementById('sother'); f.focus();
        const go = () => { if (f.value.trim()) { A.surgery = f.value.trim(); next(); } };
        document.getElementById('s-next').onclick = go;
        f.onkeydown = e => { if (e.key === 'Enter') go(); };
        document.getElementById('s-back-cat').onclick = () => { A.catId=''; A.bodyPart=''; A.surgery=''; buildFlow(); rebuildShell(); A.req={}; render(); };

          ${cat.procedures.map(p => `<button class="btn btn-ghost btn-lg" data-p="${p.id}">${p.label}<span style="display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:2px">CPT ${p.cpt}</span></button>`).join('')}
          <input class="field" id="sother" placeholder="My procedure isn't listed. Type it here" value="${A.surgery && !cat.procedures.some(p=>p.label===A.surgery) ? A.surgery : ''}" />
          <button class="btn btn-ghost btn-lg" id="s-back-cat">← Pick a different body part</button>
        </div>`);
      document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
        const p = cat.procedures.find(x => x.id === b.dataset.p);

      });
      document.getElementById('sother').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { A.surgery = e.target.value.trim(); A.cpt = ''; A.bodyPart = cat.bodyPart; buildFlow(); rebuildShell(); A.req={}; next(); } };
      document.getElementById('s-back-cat').onclick = () => { A.catId=''; A.bodyPart=''; A.surgery=''; buildFlow(); A.req={}; render(); };
    }

    function drawState() {
      panel(`
        <h2>Which state are you in?</h2>
        <p class="help">Insurance plans are different in each state, so this helps us show the right plans next.</p>
        <div class="answers">
          <select class="field" id="stsel">
            <option value="">Choose your state…</option>
            ${D.states.map(s => `<option value="${s}"${A.state === s ? ' selected' : ''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-primary btn-lg" id="st-next">Continue →</button>
        </div>`);
      const sel = document.getElementById('stsel');
      const go = () => { if (sel.value) { A.state = sel.value; next(); } };
      document.getElementById('st-next').onclick = go;
      sel.onchange = () => { A.state = sel.value; };
    }

    function drawInsurer() {
      // Insurer picker is filtered by the chosen state; always keep a free-text
      // fallback. Curated names where we have them, otherwise a generic set.
      const curated = D.insurersByState[A.state];
      // Medicare and Medicaid exist in every state, so always offer them even
      // when a state has a curated commercial-plan list.
      const options = curated
        ? curated.concat(['Medicare', 'Medicaid'].filter(x => !curated.includes(x)))
        : D.insurersGeneric;
      const isCurated = !!curated;
      panel(`
        <h2>Who's your insurance company?</h2>
        <p class="help">${isCurated ? `Here are plans we often see in ${A.state}.` : `Here are common plans.`} Pick yours, or type it in if it's not here.</p>
        <div class="answers">
          ${options.map(name => `<button class="btn btn-ghost btn-lg" data-ins="${name}"${A.insurer === name ? ' style="border-color:var(--teal)"' : ''}>${name}</button>`).join('')}
          <input class="field" id="ins" placeholder="My plan isn't listed. Type it here" value="${A.insurer && !options.includes(A.insurer) ? A.insurer : ''}" />
          <button class="btn btn-primary btn-lg" id="ins-next">Continue →</button>
        </div>`);
      document.querySelectorAll('[data-ins]').forEach(b => b.onclick = () => { A.insurer = b.dataset.ins; next(); });
      const f = document.getElementById('ins');
      const go = () => { const t = f.value.trim(); if (t) A.insurer = t; if (A.insurer) next(); };
      document.getElementById('ins-next').onclick = go;
      f.onkeydown = e => { if (e.key === 'Enter') go(); };
    }

    function drawLetter() {
      const chosen = A.letterFiles && A.letterFiles.length;
      panel(`
        <h2>Let's start with your denial letter</h2>
        <p class="help">This is the most important step. Your letter is the only place that says exactly what was turned down, so a clear photo or copy of it helps us the most.</p>
        <div class="answers">
          <label class="letter-up${chosen ? ' chosen' : ''}" id="lt-drop">
            <input type="file" id="lt-file" accept="image/*,application/pdf" ${IS_PHONE ? 'capture="environment"' : ''} multiple />
            <span class="up-ic">${chosen ? '✓' : (IS_PHONE ? '📷' : '📄')}</span>
            <span class="up-head" id="lt-head">${chosen ? 'Letter attached' : (IS_PHONE ? 'Take a photo of your denial letter' : 'Upload your denial letter')}</span>
            <p class="up-sub" id="lt-sub">${chosen ? A.letterName : LETTER_HINT}</p>

          <button class="btn btn-primary btn-lg" id="lt-yes">Continue →</button>

      document.getElementById('lt-file').onchange = e => {
        const files = Array.from(e.target.files || []);

        A.letterName = files.length === 1 ? files[0].name
          : (files.length ? files.length + ' files attached' : '');

        document.getElementById('lt-head').textContent = files.length ? 'Letter attached'
          : (IS_PHONE ? 'Take a photo of your denial letter' : 'Upload your denial letter');
        drop.querySelector('.up-ic').textContent = files.length ? '✓' : (IS_PHONE ? '📷' : '📄');
        document.getElementById('lt-sub').textContent = files.length ? A.letterName : LETTER_HINT;
      };
      document.getElementById('lt-yes').onclick = () => { A.letter = document.getElementById('lt').value.trim(); next(); };
      document.getElementById('lt-no').onclick = () => { A.letter = ''; A.letterFiles = []; A.letterName = ''; next(); };
    }

    // Map the chosen insurer name to its member-access instructions (fuzzy).
    function accessFor(name) {
      const acc = D.insurerAccess || {};
      const n = (name || '').toLowerCase();
      const has = (...w) => w.some(x => n.includes(x));
      if (has('unitedhealth', 'uhc')) return acc.unitedhealthcare;
      if (has('aetna')) return acc.aetna;
      if (has('cigna')) return acc.cigna;
      if (has('anthem', 'elevance')) return acc.anthem;
      if (has('humana')) return acc.humana;
      if (has('ambetter', 'centene', 'wellcare')) return acc.centene;
      if (has('molina')) return acc.molina;
      if (has('florida blue', 'guidewell')) return acc.floridablue;
      if (has('medicare')) return acc.medicare;
      // Blue Cross / Blue Shield is not one company — each state has its own
      // licensee and its own website. Send the patient to THEIR state's Blue
      // site by name when we know it; otherwise a generic Blue instruction.
      if (has('blue cross', 'bcbs', 'blue shield', 'hcsc')) {
        const b = (D.blueByState || {})[A.state];
        if (b) return {
          portal: b.site,
          phone: 'The Member Services number on your ID card',
          steps: [
            'Go to ' + b.site + ' (' + b.name + ') and Log In — first time, Register with the member ID on your card.',
            "Open 'My Coverage' / 'Benefits' / 'Plan Documents'.",
            'Download your Summary of Benefits and Coverage (SBC) or Benefit Booklet.',
          ],
        };
        return {
          portal: "your state's Blue Cross Blue Shield site",
          phone: 'The Member Services number on your ID card',
          steps: [
            'Search "' + (A.state || 'your state') + ' Blue Cross Blue Shield" and open your plan\'s official site, then Log In.',
            "Open 'My Coverage' / 'Benefits' / 'Plan Documents'.",
            'Download your Summary of Benefits and Coverage (SBC) or Benefit Booklet.',
          ],
        };
      }
      return null;
    }

    // Optional: show the patient where THEIR policy lives, and let them upload it.
    // Uploading is never required. With brief consent, a de-identified copy helps
    // the next patient on the same plan (verified before any reuse; flagged stale
    // after ~90 days). Live retrieval still runs regardless.
    function drawPolicy() {
      const acc = accessFor(A.insurer) || D.insurerAccessGeneric;
      const chosen = A.policyFiles && A.policyFiles.length;
      const named = A.insurer || 'your insurer';
      panel(`
        <h2>Can you get a copy of your policy?</h2>
        <p class="help">This is optional and you can skip it. Your denial letter is the important part — but if you can grab your plan's coverage document, it makes your appeal even stronger.</p>
        <div class="pol-how">
          <h3>How to find it with ${esc(named)}</h3>
          <ol>${acc.steps.map(s => `<li>${rich(s)}</li>`).join('')}</ol>
          <p class="pol-phone">Prefer to call? ${rich(acc.phone)}</p>
        </div>
        <div class="answers">
          <label class="letter-up${chosen ? ' chosen' : ''}" id="pol-drop">
            <input type="file" id="pol-file" accept="image/*,application/pdf" ${IS_PHONE ? 'capture="environment"' : ''} multiple />
            <span class="up-ic">${chosen ? '✓' : '📄'}</span>
            <span class="up-head" id="pol-head">${chosen ? 'Policy attached' : 'Upload your policy (optional)'}</span>
            <p class="up-sub" id="pol-sub">${chosen ? esc(A.policyName) : 'A PDF or photo of your Summary of Benefits, coverage policy, or plan booklet'}</p>
          </label>
          <label class="consent" for="pol-consent" id="pol-consent-wrap" style="${chosen ? '' : 'display:none'}">
            <input type="checkbox" id="pol-consent" ${A.policyConsent ? 'checked' : ''}>
            <span>You can let us keep a <b>de-identified</b> copy to help other patients on the same plan. We never store your name or member ID, and we double-check any shared document before it's used. See our <a href="../legal.html" target="_blank" rel="noopener">Privacy Notice</a>.</span>
          </label>
          <button class="btn btn-primary btn-lg" id="pol-yes">Continue →</button>
          <button class="letter-skip" id="pol-no">I don't have my policy — skip for now</button>
        </div>`);

      const drop = document.getElementById('pol-drop');
      const consentWrap = document.getElementById('pol-consent-wrap');
      document.getElementById('pol-file').onchange = e => {
        const files = Array.from(e.target.files || []);
        A.policyFiles = files;
        A.policyName = files.length === 1 ? files[0].name : (files.length ? files.length + ' files attached' : '');
        drop.classList.toggle('chosen', !!files.length);
        document.getElementById('pol-head').textContent = files.length ? 'Policy attached' : 'Upload your policy (optional)';
        drop.querySelector('.up-ic').textContent = files.length ? '✓' : '📄';
        document.getElementById('pol-sub').textContent = files.length ? A.policyName : 'A PDF or photo of your Summary of Benefits, coverage policy, or plan booklet';
        consentWrap.style.display = files.length ? '' : 'none';
      };
      const cb = document.getElementById('pol-consent');
      if (cb) cb.onchange = () => { A.policyConsent = cb.checked; };
      document.getElementById('pol-yes').onclick = () => next();
      document.getElementById('pol-no').onclick = () => { A.policyFiles = []; A.policyName = ''; A.policyConsent = false; next(); };
    }

    // How many of the four conservative-care questions the patient has said "yes"
    // to so far. It drives the gentle 2-of-4 reassurance (never a hard gate).
    function reqYesCount() {
      return REQ.filter(x => A.req[x.id]?.have).length;
    }

    function drawReq(r) {
      // Prepopulate from the clinical default ("yes" for the conservative-care
      // questions) the first time this step is shown, so most patients can just
      // confirm. The patient can still change it; nothing here is locked.
      if (A.req[r.id] === undefined && r.default) {
        A.req[r.id] = { have: r.default === 'yes', answer: r.default };
      }
      const cur = A.req[r.id]?.answer || '';
      const isReq = REQ.some(x => x.id === r.id); // a conservative-care question
      const yes = reqYesCount();
      const reassure = (isReq && (D.requirementsIntro))
        ? `<p class="help" style="color:var(--teal-deep)">${D.requirementsIntro}${yes ? ` <b>You've noted ${yes} so far.</b>` : ''}</p>`
        : '';
      const sel = v => cur === v ? ' btn-primary' : ' btn-ghost';
      panel(`
        <h2>${r.q}</h2>
        <p class="help">${r.why}</p>
        <div class="answers">
          <button class="btn btn-lg${sel('yes')}" data-h="yes">Yes</button>
          <button class="btn btn-lg${sel('no')}" data-h="no">No / not yet</button>
          <button class="btn btn-lg${sel('unsure')}" data-h="unsure">I'm not sure</button>
        </div>
        <div id="followup"></div>
        ${reassure}
        <div class="answers" style="margin-top:16px">
          <button class="btn btn-primary btn-lg" id="req-next">Continue →</button>
        </div>`);

      function drawFollowup() {
        const fu = document.getElementById('followup');
        if (!fu) return;
        // Light lasting-vs-not nuance, only when the answer is "yes".
        if (r.followup && A.req[r.id]?.have) {
          const chosen = A.req[r.id]?.lasting;
          fu.innerHTML = `
            <p class="help" style="margin-top:16px">${r.followup.q}</p>
            <div class="answers">
              ${r.followup.options.map(o => `<button class="btn btn-lg${A.req[r.id]?.followup === o.id ? ' btn-primary' : ' btn-ghost'}" data-fu="${o.id}">${o.label}</button>`).join('')}
            </div>`;
          fu.querySelectorAll('[data-fu]').forEach(b => b.onclick = () => {
            const o = r.followup.options.find(x => x.id === b.dataset.fu);
            A.req[r.id].followup = o.id; A.req[r.id].lasting = o.lasting;
            next();
          });
        } else {
          fu.innerHTML = '';
        }
      }
      drawFollowup();

      document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
        // Answering is the action, so move on. These questions are prefilled
        // with the common answer, so staying put made a tap on the already
        // highlighted button look dead. Only stop when the tap reveals the
        // followup, which is a visible change; if the followup is already on
        // screen the tap is a confirmation and should carry on.
        const followupShowing = !!document.querySelector('[data-fu]');
        const have = b.dataset.h === 'yes';
        A.req[r.id] = { have, answer: b.dataset.h };
        if (r.followup && have && !followupShowing) return drawReq(r);
        next();
      });
      document.getElementById('req-next').onclick = () => {
        if (!A.req[r.id]?.answer) A.req[r.id] = { have: false, answer: 'no' };
        next();
      };
    }

    // ---- Optional "tell us your story" free-text + voice-to-text -----------
    // Feature-detect the Web Speech API (Chrome/Edge-ish; Firefox/Safari may
    // lack it). If missing, the mic is never rendered and typing stays the only
    // path, so the control is never broken. Typing is always available.
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    A.story = A.story || '';

    // Heuristic for "thin structured input": did the patient give us enough to
    // build a strong appeal, or should we gently ask them to tell their story?
    // Keys entirely off the existing in-memory state (A), non-blocking.
    function structuredThin() {
      const noLetter = !(A.letter && A.letter.trim()) && !(A.letterFiles && A.letterFiles.length);
      const cat = D.procedureCategories.find(c => c.id === A.catId);
      const unlistedProcedure = A.catId === '__other'
        || (cat && A.surgery && !cat.procedures.some(p => p.label === A.surgery));
      const yes = reqYesCount(); // conservative-care "yes" answers so far
      const thinCare = yes < 2;
      return noLetter || unlistedProcedure || thinCare;
    }

    // Renders the story block (heading, optional-copy, mic if supported,
    // textarea) into the element with id="storywrap". Safe to call repeatedly.
    function drawStory() {
      const wrap = document.getElementById('storywrap');
      if (!wrap) return;
      const thin = structuredThin();
      const prompt = thin
        ? `<p class="help story-nudge">We still need a bit more to build a strong appeal. Tell us your story in your own words${SpeechRec ? ' (you can speak it)' : ''}. A few sentences about how this has affected your day-to-day life can make a real difference.</p>`
        : `<p class="help">Optional, but a few sentences in your own words about how this has affected your life can strengthen your appeal.</p>`;
      const micBtn = SpeechRec
        ? `<button type="button" class="mic-btn" id="mic" aria-pressed="false" aria-label="Dictate your story with your voice">
             <span class="mic-ic" aria-hidden="true">🎙️</span><span class="mic-lbl">Speak instead</span>
           </button>`
        : '';
      wrap.innerHTML = `
        <div class="story-block">
          <div class="story-head">Anything else you'd like us to know?</div>
          ${prompt}
          <div class="story-input">
            <textarea class="field" id="story" placeholder="Tell us your story, in your own words…">${A.story || ''}</textarea>
            ${micBtn}
          </div>
        </div>`;
      const ta = wrap.querySelector('#story');
      ta.oninput = () => { A.story = ta.value; };
      if (SpeechRec) wireMic(wrap.querySelector('#mic'), ta);
    }

    // Start/stop voice dictation, appending recognized transcript to the
    // textarea and showing a visible "listening…" state.
    function wireMic(btn, ta) {
      if (!btn || !ta) return;
      let rec = null, listening = false;
      const stop = () => { listening = false; try { rec && rec.stop(); } catch (e) {} setIdle(); };
      const setIdle = () => {
        btn.classList.remove('listening'); btn.setAttribute('aria-pressed', 'false');
        btn.querySelector('.mic-lbl').textContent = 'Speak instead';
      };
      const setListening = () => {
        btn.classList.add('listening'); btn.setAttribute('aria-pressed', 'true');
        btn.querySelector('.mic-lbl').textContent = 'Listening… tap to stop';
      };
      btn.onclick = () => {
        if (listening) return stop();
        try {
          rec = new SpeechRec();
          rec.lang = (navigator.language || 'en-US');
          rec.interimResults = false; rec.continuous = true;
          rec.onresult = e => {
            let add = '';
            for (let k = e.resultIndex; k < e.results.length; k++) {
              if (e.results[k].isFinal) add += e.results[k][0].transcript;
            }
            if (add) {
              const sep = ta.value && !/\s$/.test(ta.value) ? ' ' : '';
              ta.value = ta.value + sep + add.trim();
              A.story = ta.value;
            }
          };
          rec.onerror = () => { listening = false; setIdle(); };
          rec.onend = () => { if (listening) { try { rec.start(); } catch (e) { listening = false; setIdle(); } } };
          rec.start(); listening = true; setListening();
        } catch (e) { listening = false; setIdle(); }
      };
    }

    function drawSummary() {
      const RL = reqList();
      const have = RL.filter(r => A.req[r.id]?.have);
      const gather = RL.filter(r => !A.req[r.id]?.have);
      const line = A.surgery ? A.surgery.toLowerCase() : 'your surgery';
      const who = A.insurer ? A.insurer : 'your insurance';
      panel(`
        <div class="eyebrow">Your appeal plan</div>
        <h2>Here's how to get ${line} approved</h2>
        <div class="band">${D.product.reassure}</div>
        ${have.length ? `<div class="sum">${have.map(r => item(r, 'have')).join('')}</div>` : ''}
        ${gather.length ? `<p class="help" style="margin-top:6px"><b>Next, gather these:</b></p><div class="sum">${gather.map(r => item(r, 'gather')).join('')}</div>` : ''}
        <div id="storywrap"></div>
        <label class="consent" for="consent">
          <input type="checkbox" id="consent">
          <span>I understand this helps with my insurance paperwork and is <b>not medical or legal advice</b> and not a guarantee that my insurance will approve the surgery. I agree to the <a href="../legal.html" target="_blank" rel="noopener">Privacy Notice &amp; Terms</a>.</span>
        </label>
        <div class="answers">
          <button class="btn btn-primary btn-lg" id="build" disabled aria-disabled="true">Build my appeal packet for ${who}</button>
          <button class="btn btn-ghost btn-lg" id="restart">Start over</button>
        </div>`);
      drawStory();
      const buildBtn = document.getElementById('build');
      const consent = document.getElementById('consent');
      const syncConsent = () => {
        buildBtn.disabled = !consent.checked;
        buildBtn.setAttribute('aria-disabled', String(!consent.checked));
      };
      consent.onchange = syncConsent;
      syncConsent();
      buildBtn.onclick = () => { if (consent.checked) onBuild(); };
      document.getElementById('restart').onclick = resetAll;
    }

    function item(r, mode) {
      const chip = mode === 'have'
        ? `<span class="chip done"><span class="dot"></span>You have this</span>`
        : `<span class="chip request"><span class="dot"></span>Need to request</span>`;
      const note = (A.req[r.id]?.note) ? `<p>${A.req[r.id].note}</p>` : `<p>${mode === 'have' ? r.plain : r.how}</p>`;
      return `<div class="item card" style="box-shadow:none">
        <div class="ic">${mode === 'have' ? '✅' : '📎'}</div>
        <div><h3>${r.title}</h3>${note}${chip}</div>
      </div>`;
    }

    // ---- Live run against the retrieval agent -----------------------------
    // The harness also serves this page, at /patient/, so the final button can
    // reach the API on the same origin. Served as a plain static preview there
    // is no API behind it, and the button says so rather than doing nothing.
    // The API sits beside the page, wherever the page is mounted. Served straight
    // from the harness the page is at /patient/map/, so the API is at /api. Behind
    // a proxy that mounts the harness under a prefix the page is at
    // /<prefix>/patient/map/, so the API is at /<prefix>/api. Deriving the base
    // from our own path keeps both cases working without a build step.
    const API = location.pathname.replace(/\/patient\/.*$/, '') + '/api';
    let apiReady = null;
    async function hasApi() {
      if (apiReady !== null) return apiReady;
      try {
        const r = await fetch(API + '/health', { cache: 'no-store' });
        const j = await r.json();
        apiReady = r.ok && j.ok === true;
      } catch (e) { apiReady = false; }
      return apiReady;
    }

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function li(items) { return (items || []).filter(Boolean).map(t => '<li>' + esc(t) + '</li>').join(''); }

    // Everything the patient told us, as plain lines the agent can read.
    function careNotes() {
      const lines = [];
      reqList().forEach(r => {
        const a = A.req[r.id];
        if (!a || !a.answer) return;
        const label = a.answer === 'yes' ? 'yes' : (a.answer === 'no' ? 'no / not yet' : 'not sure');
        let line = r.title + ': ' + label;
        if (a.followup && r.followup) {
          const o = r.followup.options.find(x => x.id === a.followup);
          if (o) line += ' (' + o.label + ')';
        }
        lines.push(line);
      });
      if (A.story && A.story.trim()) lines.push("In the patient's own words: " + A.story.trim());
      return lines.join('\n');
    }

    const MAX_PAGES = 8;
    const MAX_EDGE = 1600; // the reader downsamples past this anyway

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).split(',')[1] || '');
        fr.onerror = () => rej(new Error('We could not open ' + file.name + '.'));
        fr.readAsDataURL(file);
      });
    }

    async function loadBitmap(file) {
      // createImageBitmap applies the phone's rotation tag, so a sideways photo
      // arrives upright. Older browsers fall back to a plain image element.
      if (window.createImageBitmap) {
        try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
        catch (e) { /* fall through */ }
      }
      const url = URL.createObjectURL(file);
      try {
        return await new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => rej(new Error('We could not open ' + file.name + '.'));
          im.src = url;
        });
      } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
    }

    // A phone photo is several megabytes and far larger than the reader can use.
    // Shrinking it here keeps the upload quick on a mobile connection without
    // losing any detail the reader would have seen.
    async function shrinkImage(file) {
      const bmp = await loadBitmap(file);
      const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
      if (!w0 || !h0) throw new Error('We could not open ' + file.name + '.');
      const scale = Math.min(1, MAX_EDGE / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      return { name: file.name, mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
    }

    async function filesToAttachments(files) {
      const out = [];
      for (const f of (files || []).slice(0, MAX_PAGES)) {
        if ((f.type || '').startsWith('image/')) out.push(await shrinkImage(f));
        else if (f.type === 'application/pdf') {
          if (f.size > 12 * 1024 * 1024) throw new Error(f.name + ' is too large to send. Please attach a smaller file.');
          out.push({ name: f.name, mime: 'application/pdf', data: await fileToBase64(f) });
        }
      }
      return out;
    }
    async function letterAttachments() { return filesToAttachments(A.letterFiles); }

    // The server reads any attached photo into text before the search starts, so
    // send the picture itself. Only describe the gap when there is no letter.
    async function submissionBody() {
      const attachments = await letterAttachments();
      const policy_attachments = await filesToAttachments(A.policyFiles);
      const pasted = (A.letter || '').trim();
      const denial = pasted || (attachments.length ? '' : [
        'The patient did not paste the text of the denial letter.',
        'They could not find the letter.',
        (A.insurer || 'Their insurer') + ' denied ' + (A.surgery || 'the surgery')
          + (A.cpt ? ' (CPT ' + A.cpt + ')' : '') + '.'
      ].join(' '));
      return {
        denial_letter: denial,
        attachments: attachments,
        policy_attachments: policy_attachments,
        policy_consent: !!A.policyConsent,
        payer: A.insurer || '',
        plan_name: '',
        state: A.state || '',
        product_clue: '',
        procedure: A.surgery || '',
        cpt: A.cpt || '',
        treating_practice: '',
        patient_notes: careNotes(),
        retrieval_mode: 'web_only'
      };
    }

    const RUN = { id: null, timer: null, poll: null, startedAt: 0 };
    function stopRun() {
      if (RUN.timer) clearInterval(RUN.timer);
      if (RUN.poll) clearInterval(RUN.poll);
      RUN.timer = null; RUN.poll = null;
    }
    function setRunLine(text) {
      const el = document.getElementById('runline');
      if (el && text) el.textContent = text;
    }

    function runPanel(note) {
      panel(`
        <div class="eyebrow">Working on your appeal</div>
        <h2>Finding the exact rule ${esc(A.insurer || 'your plan')} used</h2>
        <p class="help">We are reading the published policy for ${esc((A.surgery || 'your surgery').toLowerCase())}. This takes a few minutes. You can leave this page open.</p>
        <div class="runbox">
          <div class="spin" aria-hidden="true"></div>
          <div>
            <div class="runline" id="runline">${esc(note)}</div>
            <div class="runtime" id="runtime">0:00 elapsed</div>
          </div>
        </div>
        <div class="answers" style="margin-top:20px">
          <button class="btn btn-ghost btn-lg" id="run-cancel">Stop and go back</button>
        </div>`);
      document.getElementById('run-cancel').onclick = () => { stopRun(); render(); };
      RUN.timer = setInterval(() => {
        const el = document.getElementById('runtime');
        if (!el) return;
        const s = Math.floor((Date.now() - RUN.startedAt) / 1000);
        el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' elapsed';
      }, 1000);
    }

    function previewPanel() {
      panel(`
        <div class="eyebrow">Preview only</div>
        <h2>This preview isn't connected yet</h2>
        <p class="help">You're viewing a preview of OrthoAppeals that isn't linked to the live service, so it can't run your appeal right now. Please open the live site to start your appeal.</p>
        <div class="answers"><button class="btn btn-ghost btn-lg" id="prev-back">← Go back</button></div>`);
      document.getElementById('prev-back').onclick = () => render();
    }

    function failPanel(message) {
      panel(`
        <div class="eyebrow">Something went wrong</div>
        <h2>We could not finish the search</h2>
        <p class="help">Nothing you entered was lost. You can try again.</p>
        <div class="pkt warn"><h3>What happened</h3><p>${esc(message)}</p></div>
        <div class="answers">
          <button class="btn btn-primary btn-lg" id="fail-retry">Try again</button>
          <button class="btn btn-ghost btn-lg" id="fail-back">← Go back</button>
        </div>`);
      document.getElementById('fail-retry').onclick = onBuild;
      document.getElementById('fail-back').onclick = () => render();
    }

    async function onBuild() {
      if (!(await hasApi())) return previewPanel();
      stopRun();
      RUN.startedAt = Date.now();
      runPanel('Sending your answers.');
      let snap;
      try {
        const body = await submissionBody();
        if (body.attachments.length) {
          setRunLine(body.attachments.length > 1
            ? 'Reading the ' + body.attachments.length + ' pages you sent.'
            : 'Reading the letter you sent.');
        }
        const r = await fetch(API + '/episodes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        snap = await r.json();
        if (!r.ok) throw new Error(snap.error || 'The server refused the request.');
      } catch (e) {
        stopRun();
        return failPanel(e.message || String(e));
      }
      RUN.id = snap.manifest && snap.manifest.episode_id;
      if (!RUN.id) { stopRun(); return failPanel('The server did not return a case number.'); }
      setRunLine('Searching for the policy that covers your plan.');
      RUN.poll = setInterval(pollRun, 5000);
    }

    async function pollRun() {
      if (!RUN.id) return;
      let snap;
      try {
        snap = await fetch(API + '/episodes/' + RUN.id, { cache: 'no-store' }).then(r => r.json());
      } catch (e) { return; }
      const arm = (snap.arms && snap.arms.web_only) || {};
      const status = (arm.runtime && arm.runtime.status) || 'running';
      // The harness writes engineering-language events. A patient should never
      // read them, so report the stage in plain words instead of echoing them.
      const events = (snap.events || []).filter(e => e.arm === 'web_only' && e.summary);
      if (events.length) {
        const mins = (Date.now() - RUN.startedAt) / 60000;
        setRunLine(mins < 1 ? 'Looking up the published rules for your plan.'
          : mins < 4 ? 'Reading the policy document your plan follows.'
          : 'Checking your answers against that policy.');
      }
      if (status === 'completed' && arm.result) { stopRun(); packetPanel(arm.result, arm.appeal); return; }
      if (status === 'failed') {
        stopRun();
        failPanel((arm.runtime && arm.runtime.error) || 'The search did not finish.');
      }
    }

    // ---- the finished appeal plan ---------------------------------------
    // The agent returns far more than one screen of text, and a patient holding
    // a phone cannot act on a wall of prose. Nothing the agent said is dropped
    // here. It is reordered around doing: one thing to start, a checklist she
    // can tick and come back to, her own answers to type, and one list to hand
    // the surgeon's office. The reasoning stays one tap away.

    const URL_RE = /https?:\/\/[^\s<>"]+/g;
    const MAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
    // Real separators are required, so a case or reference number can never be
    // mistaken for a telephone number.
    const TEL_RE = /\b1?[-.\s]?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/g;

    // A number she can tap is the difference between calling today and never
    // calling. Only ever linkify what the agent itself returned. A guessed
    // payer number would send her to the wrong place, so we never add one.
    function rich(raw) {
      const text = esc(raw);
      const inline = s => s
        .replace(MAIL_RE, m => `<a href="mailto:${m}">${m}</a>`)
        .replace(TEL_RE, m => `<a href="tel:${m.replace(/[^\d]/g, '')}">${m}</a>`);
      let out = '', last = 0, m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text))) {
        out += inline(text.slice(last, m.index));
        const u = m[0].replace(/[.,;:)]+$/, '');
        out += `<a href="${u}" target="_blank" rel="noopener">${u}</a>` + m[0].slice(u.length);
        last = m.index + m[0].length;
      }
      return out + inline(text.slice(last));
    }
    function richLi(items) {
      return (items || []).filter(Boolean).map(t => '<li>' + rich(t) + '</li>').join('');
    }

    function firstLine(t, cap) {
      const s = String(t == null ? '' : t).trim();
      const m = s.match(/^[\s\S]*?[.!?](?=\s|$)/);
      let out = (m ? m[0] : s).trim();
      const max = cap || 78;
      if (out.length > max) out = out.slice(0, max - 4).replace(/[\s,;:]+\S*$/, '') + '...';
      return out;
    }
    function restLine(t) {
      const s = String(t == null ? '' : t).trim();
      const m = s.match(/^[\s\S]*?[.!?](?=\s|$)/);
      return m ? s.slice(m[0].length).trim() : '';
    }
    function words(token) { return String(token || '').replace(/_/g, ' '); }

    // An appeal takes weeks, so the plan has to survive her closing the page.
    const PLAN = { id: '', done: [], ans: {} };
    function planLoad(id) {
      PLAN.id = id || 'anon'; PLAN.done = []; PLAN.ans = {};
      try {
        const v = JSON.parse(localStorage.getItem('oa.plan.' + PLAN.id) || '{}');
        if (Array.isArray(v.done)) PLAN.done = v.done;
        if (v.ans && typeof v.ans === 'object') PLAN.ans = v.ans;
      } catch (e) { /* a locked down browser just means nothing is remembered */ }
    }
    function planSave() {
      try {
        localStorage.setItem('oa.plan.' + PLAN.id,
          JSON.stringify({ done: PLAN.done, ans: PLAN.ans }));
      } catch (e) { /* out of storage is not worth an error message */ }
    }

    function flash(btn, msg) {
      const was = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = was; }, 1900);
    }
    async function copyOut(text, btn) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }
        flash(btn, '✓ Copied');
      } catch (e) { flash(btn, 'Could not copy'); }
    }

    const ANSWER_HINT = {
      text_or_document_upload: 'What the letter says, in your own words',
      short_text: 'Your answer',
      yes_no_with_date_and_place: 'Yes or no, then roughly when and where',
      dates: 'Dates, as close as you can remember',
      date_and_reference_number: 'The date on the letter, and any reference number'
    };

    function doctorNote(res) {
      const pi = res.patient_interaction || {};
      const ns = res.next_steps || {};
      const src = (res.retrieval && res.retrieval.selected_source) || {};
      const out = ['For the surgeon\'s office, about my denied ' + (A.surgery || 'surgery')
        + (A.cpt ? ' (CPT ' + A.cpt + ')' : '') + ' with ' + (A.insurer || 'my insurer') + '.'];
      if (src.title) { out.push('', 'The policy the plan uses: ' + src.title); }
      if (src.url) out.push(src.url);
      const forOffice = (ns.ordered_actions || []).filter(a => a && a.party === 'provider');
      if (forOffice.length) {
        out.push('', 'What the office would need to do:');
        forOffice.forEach((a, n) => out.push((n + 1) + '. ' + (a.action || '')));
      }
      const recs = pi.provider_records_needed || [];
      if (recs.length) {
        out.push('', 'Records the appeal needs:');
        recs.forEach(r => out.push('- ' + r));
      }
      out.push('', 'Prepared with OrthoAppeals. This is help with insurance paperwork, not medical advice.');
      return out.join('\n');
    }

    function answerNote(qs) {
      const out = ['My answers for the appeal of my ' + (A.surgery || 'surgery') + ':', ''];
      qs.forEach((q, n) => {
        out.push((n + 1) + '. ' + q.text);
        out.push('   ' + ((PLAN.ans[q.question_id || ('q' + n)] || '').trim() || '(not answered yet)'));
        out.push('');
      });
      return out.join('\n');
    }

    function packetPanel(res, appeal) {
      const src = (res.retrieval && res.retrieval.selected_source) || {};
      const cites = (res.retrieval && res.retrieval.citations) || [];
      const cands = ((res.retrieval && res.retrieval.candidates) || []).filter(c => !c.selected);
      const pa = res.policy_analysis || {};
      const ns = res.next_steps || {};
      const pi = res.patient_interaction || {};
      const ci = res.case_identification || {};
      const conf = res.confidence || {};
      const dl = ns.deadline || {};
      const qs = pi.questions || [];
      const gaps = pa.documentation_gaps || [];
      const blockers = res.blockers || [];
      const acts = (ns.ordered_actions || []).map((a, n) => (typeof a === 'string'
        ? { action: a, order: n + 1, party: '', records_needed: [] } : a));
      const mine = acts.filter(a => a.party !== 'provider').length;
      const theirs = acts.length - mine;
      planLoad(res.episode_id);

      const taskRow = (a, n) => {
        const on = PLAN.done.indexOf(n) !== -1;
        const who = a.party === 'provider' ? "Your surgeon's office" : 'You';
        const recs = a.records_needed || [];
        return `
          <div class="task${on ? ' done' : ''}" data-task="${n}">
            <div class="thead">
              <button class="tick" data-tick="${n}" aria-pressed="${on}" aria-label="Mark step ${n + 1} done">✓</button>
              <button class="topen" data-open="${n}" aria-expanded="false" aria-controls="td-${n}">
                <span class="ttitle">${esc(firstLine(a.action))}</span>
                <span class="tmeta">Step ${n + 1} of ${acts.length} · ${esc(who)} · tap to read it all</span>
              </button>
            </div>
            <div class="tdetail" id="td-${n}" hidden>
              <p>${rich(a.action)}</p>
              ${recs.length ? `<div class="need"><b>Have this ready:</b><ul>${richLi(recs)}</ul></div>` : ''}
            </div>
          </div>`;
      };

      const qRow = (q, n) => {
        const id = q.question_id || ('q' + n);
        return `
          <div class="qa">
            <label for="ans-${esc(id)}">${n + 1}. ${rich(q.text)}</label>
            ${q.rationale ? `<button class="why" data-why="${esc(id)}">Why we ask</button>
              <p class="whytext" id="why-${esc(id)}" hidden>${rich(q.rationale)}</p>` : ''}
            <textarea class="field" id="ans-${esc(id)}" data-ans="${esc(id)}" rows="2"
              placeholder="${esc(ANSWER_HINT[q.answer_type] || 'Your answer')}"></textarea>
          </div>`;
      };

      // The headline is the agent's own first sentence and the paragraph is the
      // remainder, so the card never says the same thing twice. A very long
      // first sentence falls back to plain body text rather than a cut headline.
      const startHead = firstLine(ns.primary_action, 999);
      const startBody = startHead.length <= 130 ? restLine(ns.primary_action) : ns.primary_action;

      const deadline = dl.value
        ? `<div class="caveat"><h3>Your deadline — act soon</h3><p>${rich(dl.value)}</p></div>`
        : `<div class="caveat"><h3>Your deadline — act soon</h3><p>Appeal windows are short and easy to miss. Find the date you must appeal by on your denial letter, put it on your calendar, and start now.</p></div>`;

      // Denial-reason-aware: draft a letter only when that's the right next move;
      // otherwise show what to do first.
      const ap = (appeal && appeal.assessment) || null;
      const KIND_HEAD = {
        gather_first: 'First, confirm the exact rule',
        meet_criteria: 'One step to finish first',
        not_appealable: 'A letter may not be the right route here',
        blocked: 'We could not confirm the rule yet'
      };
      const letterSection = !ap ? '' : ap.recommended ? `
        <div class="sec" id="letter-sec">
          <h3>Your appeal letter</h3>
          <div class="letter-cta"><p>We can draft a ready-to-send appeal letter that quotes your plan's own rules back to them. You get two versions: one for your surgeon's office to send, and one you can send yourself.</p></div>
          <div class="rowbtns"><button class="btn btn-primary btn-sm" id="letter-make">Draft my appeal letter</button></div>
          <div id="letter-area"></div>
        </div>` : `
        <div class="sec" id="letter-sec">
          <h3>${esc(KIND_HEAD[ap.kind] || 'Before an appeal letter')}</h3>
          <p class="note">${rich(ap.reason || '')}</p>
        </div>`;

      panel(`
        <div class="eyebrow">Your appeal plan</div>
        <h2>You can appeal this. Here is how.</h2>
        <div class="res">
          ${acts.length ? `<div class="lead">${acts.length} steps in all. ${mine} ${mine === 1 ? 'is' : 'are'} yours to do. ${theirs} ${theirs === 1 ? 'is' : 'are'} for your surgeon's office.</div>` : ''}
          ${ns.primary_action ? `
            <div class="now">
              <div class="lbl">Start here</div>
              ${startHead.length <= 130 ? `<h3>${rich(startHead)}</h3>` : ''}
              ${startBody ? `<p>${rich(startBody)}</p>` : ''}
            </div>` : ''}
          ${deadline}
          ${letterSection}
          ${gaps.length ? `
            <div class="sec">
              <h3>The most likely problem</h3>
              <p class="note">This is our best read of your file. The full list is further down.</p>
              <div class="pkt"><p>${rich(gaps[0])}</p></div>
            </div>` : ''}
          ${acts.length ? `
            <div class="sec">
              <h3>Your checklist</h3>
              <p class="note">Tap a step to read it in full. Tap the box on the left when it is done. This page remembers your ticks, so you can come back to it.</p>
              <div class="prog"><div class="bar"><i id="pbar"></i></div><span class="cnt" id="pcnt"></span></div>
              ${acts.map(taskRow).join('')}
            </div>` : ''}
          ${ns.safety_caveat ? `<div class="caveat"><h3>Please read this before you act</h3><p>${rich(ns.safety_caveat)}</p></div>` : ''}
          <div class="rowbtns">
            <button class="btn btn-ghost btn-sm" id="plan-print">Print this plan or save it as a PDF</button>
          </div>
        </div>`);

      const el = id => document.getElementById(id);
      const refreshProgress = () => {
        const bar = el('pbar'), cnt = el('pcnt');
        if (bar) bar.style.width = (acts.length ? Math.round(100 * PLAN.done.length / acts.length) : 0) + '%';
        if (cnt) cnt.textContent = PLAN.done.length + ' of ' + acts.length + ' done';
      };
      document.querySelectorAll('[data-tick]').forEach(b => b.onclick = () => {
        const n = Number(b.dataset.tick);
        const at = PLAN.done.indexOf(n);
        if (at === -1) PLAN.done.push(n); else PLAN.done.splice(at, 1);
        planSave();
        const on = PLAN.done.indexOf(n) !== -1;
        document.querySelector('[data-task="' + n + '"]').classList.toggle('done', on);
        b.setAttribute('aria-pressed', String(on));
        refreshProgress();
      });
      document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
        const d = el('td-' + b.dataset.open);
        const opening = d.hasAttribute('hidden');
        if (opening) d.removeAttribute('hidden'); else d.setAttribute('hidden', '');
        b.setAttribute('aria-expanded', String(opening));
      });
      document.querySelectorAll('[data-why]').forEach(b => b.onclick = () => {
        const p = el('why-' + b.dataset.why);
        const opening = p.hasAttribute('hidden');
        if (opening) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
        b.textContent = opening ? 'Hide why we ask' : 'Why we ask';
      });
      document.querySelectorAll('[data-ans]').forEach(t => {
        t.value = PLAN.ans[t.dataset.ans] || '';
        t.oninput = () => { PLAN.ans[t.dataset.ans] = t.value; planSave(); };
      });
      if (el('q-copy')) el('q-copy').onclick = e => copyOut(answerNote(qs), e.currentTarget);
      if (el('doc-copy')) el('doc-copy').onclick = e => copyOut(doctorNote(res), e.currentTarget);
      if (el('doc-share')) el('doc-share').onclick = () => {
        navigator.share({ title: 'Records my appeal needs', text: doctorNote(res) }).catch(() => {});
      };
      el('plan-print').onclick = () => {
        document.querySelectorAll('.acc').forEach(d => { d.open = true; });
        document.querySelectorAll('.tdetail, .whytext').forEach(d => d.removeAttribute('hidden'));
        window.print();
      };
      if (el('restart2')) el('restart2').onclick = resetAll;

      // ---- appeal letter ------------------------------------------------
      if (ap && ap.recommended) {
        const area = () => el('letter-area');
        const LBL = { provider: "For my surgeon's office", patient: 'For me to send' };
        const showError = msg => { const a = area(); if (a) a.innerHTML = `<div class="pkt warn"><p>${esc(msg)}</p></div>`; };
        const renderLetters = letters => {
          const versions = Object.keys(letters).filter(v => letters[v] && letters[v].markdown);
          if (!versions.length) return showError('We could not draft the letter just now. Please try again.');
          let cur = versions[0];
          const draw = () => {
            const md = letters[cur].markdown;
            area().innerHTML =
              (versions.length > 1 ? `<div class="ltabs">${versions.map(v => `<button class="lt${v === cur ? ' on' : ''}" data-lv="${v}">${LBL[v] || v}</button>`).join('')}</div>` : '') +
              `<div class="letter">${renderLetter(md)}</div>` +
              `<div class="rowbtns"><button class="btn btn-primary btn-sm" id="letter-copy">Copy this letter</button><button class="btn btn-ghost btn-sm" id="letter-print">Print or save as PDF</button></div>`;
            area().querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { cur = b.dataset.lv; draw(); });
            el('letter-copy').onclick = ev => copyOut(letterPlain(md), ev.currentTarget);
            el('letter-print').onclick = () => printLetter(renderLetter(md), 'Appeal letter for ' + (A.surgery || 'my surgery'));
          };
          draw();
          const mk = el('letter-make'); if (mk) mk.style.display = 'none';
        };
        const mk = el('letter-make');
        if (mk) mk.onclick = async ev => {
          const btn = ev.currentTarget, was = btn.textContent;
          btn.disabled = true; btn.textContent = 'Writing your letter… this takes a moment';
          try {
            const j = await fetch(API + '/episodes/' + res.episode_id + '/appeal-letter', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ arm: 'web_only' })
            }).then(r => r.json());
            if (j.letters) renderLetters(j.letters);
            else { showError((j.errors && Object.values(j.errors)[0]) || j.error || 'We could not draft the letter just now. Please try again.'); btn.disabled = false; btn.textContent = was; }
          } catch (e) { showError(e.message || 'Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = was; }
        };
        // Already drafted on a previous visit? Load them back.
        const have = appeal.letters_available || [];
        if (have.length) {
          Promise.all(have.map(v => fetch(API + '/episodes/' + res.episode_id + '/appeal-letter/web_only?version=' + v, { cache: 'no-store' })
            .then(r => r.json()).catch(() => null)))
            .then(list => {
              const letters = {};
              (list || []).forEach(x => { if (x && x.markdown) letters[x.version] = { markdown: x.markdown }; });
              if (Object.keys(letters).length) renderLetters(letters);
            });
        }
      }
      refreshProgress();
    }

    // ---- letter rendering helpers ---------------------------------------
    function inlineMd(s) {
      let t = esc(s);
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
           .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
           .replace(/\[([^\]\n]+)\]/g, '<mark>[$1]</mark>')
           .replace(MAIL_RE, m => `<a href="mailto:${m}">${m}</a>`);
      return t;
    }
    function renderLetter(md) {
      const blocks = String(md == null ? '' : md).replace(/\r/g, '').trim().split(/\n{2,}/);
      return blocks.map(b => {
        const h = b.match(/^#{1,6}\s+([\s\S]+)$/);
        if (h) return '<h4>' + inlineMd(h[1].trim()) + '</h4>';
        return '<p>' + inlineMd(b).replace(/\n/g, '<br>') + '</p>';
      }).join('');
    }
    function letterPlain(md) {
      return String(md == null ? '' : md)
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, '$1$2')
        .trim();
    }
    function printLetter(html, title) {
      const w = window.open('', '_blank');
      if (!w) { window.print(); return; }
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) +
        '</title><style>body{font-family:Georgia,\'Times New Roman\',serif;line-height:1.6;max-width:680px;margin:40px auto;padding:0 24px;color:#1a1a1a}h4{font-size:18px;margin:18px 0 6px}p{margin:0 0 13px}mark{background:#fdf1d6;padding:0 3px}em{color:#555}</style></head><body>' +
        html + '</body></html>');
      w.document.close(); w.focus();
      setTimeout(() => { try { w.print(); } catch (e) {} }, 300);
    }

    function resetAll() {
      stopRun();
      RUN.id = null;
      A.catId=''; A.surgery=''; A.cpt=''; A.bodyPart=''; A.state=''; A.insurer='';
      A.letter=''; A.letterFiles=[]; A.letterName=''; A.policyFiles=[]; A.policyName=''; A.policyConsent=false; A.req={}; A.story='';
      A.__demoExample=false;
      buildFlow(); showHero();
    }

    function next() { i = Math.min(flow.length - 1, i + 1); render(); }

    showHero();
  </script>
</body>
